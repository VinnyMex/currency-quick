<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apoiar vWeb Marketing</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0F172A;
      --bg-card:   #1E293B;
      --bg-input:  #0F172A;
      --text:      #F1F5F9;
      --text-muted:#94A3B8;
      --border:    #334155;
      --success:   #10B981;
      --success-bg:#064E3B;
      --success-tx:#D1FAE5;
      color-scheme: dark;
    }
    .theme-light {
      --bg:        #F1F5F9;
      --bg-card:   #FFFFFF;
      --bg-input:  #E2E8F0;
      --text:      #0F172A;
      --text-muted:#475569;
      --border:    #CBD5E1;
      --success:   #16A34A;
      --success-bg:#DCFCE7;
      --success-tx:#166534;
      color-scheme: light;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(16px, 4vh, 24px) clamp(14px, 4vw, 22px);
      width: min(340px, 94vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 1.8vh, 14px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      animation: slideUp 0.2s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .title {
      font-size: clamp(14px, 3.5vh, 17px);
      font-weight: 700;
      text-align: center;
      color: var(--text);
      line-height: 1.3;
    }

    .sub {
      font-size: clamp(11px, 2.5vh, 13px);
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
    }

    .qr-wrap {
      background: #fff;
      border-radius: 10px;
      padding: clamp(6px, 1.5vh, 10px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    .qr-wrap img {
      width:  clamp(140px, 38vw, 180px);
      height: clamp(140px, 38vw, 180px);
      display: block;
      image-rendering: pixelated;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--success-bg);
      border: 1px solid var(--success);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: clamp(11px, 2.5vh, 13px);
      color: var(--success-tx);
      width: 100%;
      justify-content: center;
    }

    .badge-icon {
      background: var(--success);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .key-box {
      font-family: 'Courier New', monospace;
      font-size: clamp(10px, 2.2vh, 12px);
      color: var(--text-muted);
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      width: 100%;
      text-align: center;
      word-break: break-all;
      user-select: all;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .key-box:hover { border-color: var(--success); }

    .copied-msg {
      font-size: 10px;
      color: var(--success);
      text-align: center;
      height: 12px;
      line-height: 12px;
    }

    .mpago-btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: linear-gradient(135deg, #009ee3, #0070ba);
      border-radius: 8px;
      color: #fff;
      font-size: clamp(12px, 2.8vh, 14px);
      font-weight: 700;
      padding: clamp(8px, 1.8vh, 11px) 14px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,112,186,0.35);
      transition: opacity 0.15s, transform 0.15s;
    }
    .mpago-btn:hover { opacity: 0.88; transform: translateY(-1px); }

    .close-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: clamp(11px, 2.5vh, 13px);
      font-weight: 600;
      padding: clamp(7px, 1.6vh, 9px) 14px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s, color 0.15s;
    }
    .close-btn:hover { background: var(--border); color: var(--text); }
  </style>
</head>
