<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:440px;height:280px;overflow:hidden;background:linear-gradient(135deg,#0F172A 0%,#1E3A5F 100%);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;position:relative}
.glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.25),transparent 70%);top:-60px;right:-60px}
.content{display:flex;align-items:center;gap:28px;z-index:1}
.icon-wrap{position:relative}
.icon-wrap img{width:100px;height:100px;border-radius:22px;box-shadow:0 8px 32px rgba(59,130,246,.5)}
.badge{position:absolute;bottom:-6px;right:-6px;background:#22C55E;color:#fff;font-size:9px;font-weight:800;padding:3px 7px;border-radius:999px;letter-spacing:.04em;white-space:nowrap}
.text h1{font-size:26px;font-weight:900;color:#F1F5F9;line-height:1.1;letter-spacing:-.02em}
.text h1 span{background:linear-gradient(135deg,#93C5FD,#3B82F6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.text p{font-size:13px;color:#94A3B8;margin-top:8px;line-height:1.5;max-width:220px}
.chips{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.chip{background:rgba(59,130,246,.2);border:1px solid rgba(59,130,246,.4);border-radius:999px;color:#93C5FD;font-size:11px;font-weight:600;padding:3px 10px}
</style>
</head>
