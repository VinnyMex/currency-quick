<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:800px;overflow:hidden;background:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;position:relative}
.chrome-bar{width:100%;height:56px;background:#dee1e6;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #c5c8cd}
.chrome-dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%}
.d1{background:#ff5f57}.d2{background:#febc2e}.d3{background:#28c840}
.chrome-addr{flex:1;max-width:600px;margin:0 auto;background:#fff;border-radius:20px;height:32px;display:flex;align-items:center;padding:0 16px;gap:8px;border:1px solid #dadce0}
.chrome-addr .url{color:#202124;font-size:13px}
.ext-icons{display:flex;gap:8px;align-items:center}
.ext-icon{width:28px;height:28px;border-radius:6px;background:#e8eaed;display:flex;align-items:center;justify-content:center;font-size:15px}
.ext-active{background:#1a73e8}
/* Página */
.page{width:100%;height:744px;background:#F1F5F9;display:flex;align-items:flex-start;justify-content:center;padding-top:24px}
/* Popup tema claro */
.popup{width:320px;background:#fff;border:1px solid #CBD5E1;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.15);overflow:hidden}
.pw-header{background:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #e2e8f0}
.pw-logo{font-size:18px;color:#2563EB}
.pw-title{color:#0F172A;font-size:14px;font-weight:700;flex:1}
.pw-theme{background:#E2E8F0;border:1px solid #CBD5E1;border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px}
.pw-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pw-input{background:#E2E8F0;border:1.5px solid #2563EB;border-radius:8px;padding:10px 14px;font-size:22px;font-weight:700;color:#0F172A;text-align:right}
.pw-labels{display:grid;grid-template-columns:1fr 36px 1fr;gap:6px;font-size:10px;color:#94A3B8;text-transform:uppercase;letter-spacing:.05em}
.pw-labels span:last-child{text-align:right}
.pw-row{display:grid;grid-template-columns:1fr 36px 1fr;gap:6px;align-items:center}
.pw-sel{background:#E2E8F0;border:1.5px solid #CBD5E1;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:600;color:#0F172A;text-align:center}
.pw-inv{background:#E2E8F0;border:1.5px solid #CBD5E1;border-radius:8px;height:36px;display:flex;align-items:center;justify-content:center;color:#2563EB;font-size:16px}
.pw-btn{background:#2563EB;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;padding:11px;text-align:center}
.pw-result{background:#EFF6FF;border:1.5px solid #2563EB;border-radius:8px;padding:12px;text-align:center}
.pw-rval{font-size:26px;font-weight:800;color:#1D4ED8}
.pw-rrate{font-size:11px;color:#475569;margin-top:4px}
/* Histórico */
.hist-header{display:flex;align-items:center;justify-content:space-between;padding:0 14px;margin-bottom:6px}
.hist-title{font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.06em}
.hist-clear{font-size:10px;color:#94A3B8;background:none;border:none;cursor:pointer}
.hist-item{margin:0 14px 6px;background:#F1F5F9;border:1px solid #CBD5E1;border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:6px}
.hi-pair{font-size:12px;font-weight:700;color:#0F172A}
.hi-time{font-size:10px;color:#94A3B8}
.hi-val{font-size:12px;font-weight:700;color:#0F172A;text-align:right}
.hi-from{font-size:11px;color:#64748B;text-align:right}
.hi-btns{display:flex;gap:4px;margin-top:4px;justify-content:flex-end}
.hi-reconvert{background:#EFF6FF;border:1px solid #2563EB;border-radius:5px;color:#2563EB;font-size:10px;padding:2px 8px}
.hi-del{background:none;border:1px solid transparent;border-radius:5px;color:#94A3B8;font-size:12px;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.divider{height:1px;background:#e2e8f0;margin:6px 14px}
.pw-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid #e2e8f0}
.pw-options{color:#94A3B8;font-size:11px;background:none;border:none}
.pw-donate{background:linear-gradient(135deg,#F59E0B,#F97316);border:none;border-radius:6px;color:#fff;font-size:10px;font-weight:700;padding:5px 10px}
</style>
</head>
